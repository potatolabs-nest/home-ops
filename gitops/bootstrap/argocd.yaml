apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.9.2
    helm:
      values: |
        configs:
          secret:
            createSecret: false

          params:
            server.insecure: "true"

          cm:
           url: https://argocd.potatolabs.uk

           resource.exclusions: |
             []

           oidc.config: |
             name: Pocket ID
             issuer: $argocd-pocket-id:issuer_url
             clientID: $argocd-pocket-id:client_id
             clientSecret: $argocd-pocket-id:client_secret
             requestedScopes:
               - openid
               - profile
               - email
               - groups
             enablePKCEAuthentication: true

          rbac:
            policy.default: role:readonly
            scopes: '[groups]'
            policy.csv: |
              g, argocd-admins, role:admin
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      prune: true
      selfHeal: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-https
  namespace: argocd
spec:
  parentRefs:
    - name: gateway-private
      namespace: kube-system
      sectionName: https
  hostnames:
    - argocd.potatolabs.uk
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
