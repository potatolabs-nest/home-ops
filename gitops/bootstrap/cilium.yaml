apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.20.1
    helm:
      values: |
        kubeProxyReplacement: true
        k8sServiceHost: 172.20.0.20
        k8sServicePort: 6443
        l2announcements:
          enabled: true
        externalIPs:
          enabled: true
        gatewayAPI:
          enabled: true
        ipam:
          mode: kubernetes
        operator:
          replicas: 1
        securityContext:
          privileged: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true

