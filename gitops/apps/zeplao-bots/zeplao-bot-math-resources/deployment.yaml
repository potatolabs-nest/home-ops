apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeplao-bot-math
  namespace: zeplao
  labels:
    app.kubernetes.io/name: zeplao-bot-math
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: zeplao-bot-math

  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeplao-bot-math

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: bot
          image: git.potatolabs.uk/zeplao/zeplao-bot-math:sha-34ee19e8efd02649e76afcab1c0b7452404990b8
          imagePullPolicy: IfNotPresent

          env:
            - name: ZEPLAO_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-math
                  key: ZEPLAO_BOT_TOKEN

            - name: ZEPLAO_BOT_API
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-math
                  key: ZEPLAO_BOT_API
                  optional: true

            - name: MATHBOT_STATE
              value: /app/data/state.json

          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000

          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeplao-bot-math-data
