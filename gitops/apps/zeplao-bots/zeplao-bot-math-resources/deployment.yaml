apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeplao-bot-math
  namespace: zeplao
  labels:
    app.kubernetes.io/name: zeplao-bot-math
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: zeplao-bot-math

  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeplao-bot-math

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: bot
          image: git.potatolabs.uk/zeplao/zeplao-bot-math:sha-8bc15441109257550f8317625afc88618e0899ed
          imagePullPolicy: IfNotPresent

          env:
            - name: ZEPLAO_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-math
                  key: ZEPLAO_BOT_TOKEN

            - name: ZEPLAO_BOT_API
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-math
                  key: ZEPLAO_BOT_API
                  optional: true

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000

