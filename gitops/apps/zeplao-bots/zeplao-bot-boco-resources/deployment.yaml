apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeplao-bot-boco
  namespace: zeplao
  labels:
    app.kubernetes.io/name: zeplao-bot-boco
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: zeplao-bot-boco

  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeplao-bot-boco

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: bot
          image: git.potatolabs.uk/zeplao/zeplao-bot-boco:sha-2a08d17785560d828f570b0808686a2d4b053663
          imagePullPolicy: IfNotPresent

          env:
            - name: ZEPLAO_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-boco
                  key: ZEPLAO_BOT_TOKEN

            - name: ZEPLAO_BOT_API
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-boco
                  key: ZEPLAO_BOT_API
                  optional: true

            - name: DNSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-boco
                  key: DNSE_API_KEY
                  optional: true

            - name: DNSE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: zeplao-bot-boco
                  key: DNSE_API_SECRET
                  optional: true

            - name: BOCO_STATE
              value: /app/data/state.json

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000

          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeplao-bot-boco-data
