provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/zekker6/external-dns-provider-adguard
      tag: v1.5.1
      pullPolicy: IfNotPresent
    env:
      - name: ADGUARD_HOME_URL
        value: "http://172.20.0.8/control"
      - name: ADGUARD_HOME_USER
        valueFrom:
          secretKeyRef:
            name: external-dns
            key: username
      - name: ADGUARD_HOME_PASS
        valueFrom:
          secretKeyRef:
            name: external-dns
            key: password
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: true
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8888
    readinessProbe:
      httpGet:
        path: /healthz 
        port: 8888

    service:
      port: 8888
sources:
  - gateway-httproute
policy: sync
domainFilters:
  - potatolabs.uk
extraArgs:
  - --webhook-provider-url=http://localhost:8888
