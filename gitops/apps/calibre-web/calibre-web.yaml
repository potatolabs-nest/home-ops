apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calibre-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.potatolabs.uk/homelabs/home-ops.git
    targetRevision: main
    path: gitops/apps/calibre-web/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: calibre-web

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

