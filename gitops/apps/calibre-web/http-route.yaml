apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web-https
  namespace: calibre-web
spec:
  parentRefs:
    - name: gateway-public
      namespace: kube-system
      sectionName: http
  hostnames:
    - books.potatolabs.uk
  rules:
    - backendRefs:
        - name: calibre-web
          port: 8083

