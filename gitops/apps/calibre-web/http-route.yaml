apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  parentRefs:
    - name: gateway-public
      namespace: gateway-system
      sectionName: http
  hostnames:
    - books.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: calibre-web
          port: 8083
