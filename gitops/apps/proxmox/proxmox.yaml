apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: proxmox-backend-tls
  namespace: proxmox
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: proxmox-external
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: proxmox-ca
    hostname: pve01.home.arpa
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox
  namespace: proxmox
spec:
  parentRefs:
    - name: gateway-private
      namespace: kube-system
      sectionName: https
  hostnames:
    - pve.potatolabs.uk
  rules:
    - backendRefs:
        - name: proxmox-external
          port: 8006
