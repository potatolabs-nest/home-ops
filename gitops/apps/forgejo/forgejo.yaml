apiVersion: v1
kind: Service
metadata:
  name: forgejo-external
  namespace: gateway-system
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: forgejo-external
  namespace: gateway-system
  labels:
    kubernetes.io/service-name: forgejo-external
    endpointslice.kubernetes.io/managed-by: cluster-admins
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    appProtocol: http
    port: 3000
endpoints:
  - addresses:
      - 172.20.0.40
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: gateway-system
spec:
  parentRefs:
    - name: main
      namespace: kube-system
      sectionName: https
  hostnames:
    - git.potatolabs.uk
  rules:
    - backendRefs:
        - name: forgejo-external
          port: 3000
