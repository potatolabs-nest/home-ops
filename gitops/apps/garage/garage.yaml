apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
    targetRevision: v2.3.0
    path: script/helm/garage
    helm:
      values: |
        deployment:
          kind: StatefulSet
          replicaCount: 1

        garage:
          replicationFactor: "1"
          consistencyMode: consistent

          s3:
            api:
              region: garage
              rootDomain: ".s3.potatolabs.uk"

        persistence:
          enabled: true

          meta:
            storageClass: longhorn
            size: 3Gi

          data:
            storageClass: longhorn
            size: 20Gi

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-https
  namespace: garage
spec:
  parentRefs:
    - name: main
      namespace: kube-system
      sectionName: https
  hostnames:
    - s3.potatolabs.uk
  rules:
    - backendRefs:
        - name: garage
          port: 3900

