apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: headlamp-admins
  namespace: headlamp
spec:
  friendlyName: headlamp-admins
  users:
    usernames:
      - hieu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocketid-headlamp-admins
subjects:
  - kind: Group
    name: pocketid:headlamp-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
