apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
  namespace: pocket-id
spec:
  name: Headlamp
  clientID: headlamp
  description: Kubernetes Headlamp
  isPublic: false
  pkceEnabled: true
  skipConsent: true

  callbackUrls:
    - https://headlamp.potatolabs.uk/oidc-callback

  logoutCallbackUrls:
    - https://headlamp.potatolabs.uk/

  secret:
    name: headlamp-oidc

    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "headlamp"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "headlamp"

    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
