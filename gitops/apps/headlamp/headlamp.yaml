apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      values: |
        service:
          type: ClusterIP

        config:
          inCluster: true
          oidc:
            secret:
              create: false
            externalSecret:
              enabled: true
              name: headlamp-oidc
              hasScopes: true

        # Required because these values are not generated by
        # Pocket ID operator's credentials Secret.
        env:
          - name: OIDC_SCOPES
            value: "openid,profile,email,groups"
          - name: OIDC_CALLBACK_URL
            value: "https://headlamp.potatolabs.uk/oidc-callback"
          - name: OIDC_USE_PKCE
            value: "true"

        # Native OIDC users are authorized by their own tokens.
        # Do not give Headlamp's pod ServiceAccount cluster-admin.
        serviceAccount:
          create: false

        clusterRoleBinding:
          clusterRoleName: cluster-admin

        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-https
  namespace: headlamp
spec:
  parentRefs:
    - name: main
      namespace: kube-system
      sectionName: https
  hostnames:
    - headlamp.potatolabs.uk
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
