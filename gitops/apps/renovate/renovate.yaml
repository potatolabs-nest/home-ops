apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://docs.renovatebot.com/helm-charts
    chart: renovate
    targetRevision: 46.279.4
    helm:
      values: |
        existingSecret: renovate-token
        cronjob:
          schedule: "0 1 * * *"
        renovate:
          existingSecret: renovate-token

          config: |
            {
              "platform": "forgejo",
              "endpoint": "https://git.potatolabs.uk",
              "repositories": ["homelabs/home-ops"],
              "gitAuthor": "Renovate Bot <renovate@potatolabs.uk>",
              "automerge": false
            }
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

